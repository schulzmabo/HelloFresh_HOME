<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Küchenwoche — Rike & Papa</title>
<style>
:root {
  --dg: #4A7C59; --teal: #008080; --gold: #B8860B;
  --bg: #F4F7F2; --bg2: #EFF5E8; --bg3: #FAFAF2;
  --hdr: #D4E4C1; --border: #D0DFC8;
  --txt: #333; --txt2: #666;
  --green-bg: #E8F5E9; --blue-bg: #E3F2FD; --orange-bg: #FFF3E0; --yellow-bg: #FFFDE7;
  --green-bar: #4CAF50; --blue-bar: #2196F3; --orange-bar: #FF9800; --yellow-bar: #F9A825;
  --shadow: 0 1px 6px rgba(74,124,89,.10);
  --radius: 8px;
}
[data-theme="dark"] {
  --bg: #1a1f1c; --bg2: #222b25; --bg3: #1e251f;
  --hdr: #2a3d2e; --border: #2e3f32;
  --txt: #e8ede9; --txt2: #8fa893;
  --green-bg: #1a2e1d; --blue-bg: #1a2535; --orange-bg: #2e2010; --yellow-bg: #2a2510;
  --shadow: 0 1px 6px rgba(0,0,0,.3);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--txt); font-size: 14px; line-height: 1.5; }

/* HEADER */
.site-header { background: var(--dg); color: #fff; padding: 12px 14px 0; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
.header-row { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; }
.site-title { font-size: 17px; font-weight: 700; }
.site-sub { font-size: 10px; opacity: .75; }
.header-actions { display: flex; gap: 8px; align-items: center; }
.budget-badge { background: var(--gold); color: #fff; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 10px; }
.theme-btn { background: rgba(255,255,255,.18); border: none; color: #fff; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; }

/* NAV */
.nav-tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.nav-tabs::-webkit-scrollbar { display: none; }
.nav-tab { background: rgba(255,255,255,.13); color: rgba(255,255,255,.82); border: none; cursor: pointer; padding: 7px 14px; border-radius: 6px 6px 0 0; font-size: 12px; font-weight: 600; white-space: nowrap; transition: all .15s; }
.nav-tab.active { background: var(--bg); color: var(--dg); }

/* MAIN */
.main { padding: 12px; max-width: 680px; margin: 0 auto; }
.view { display: none; }
.view.active { display: block; }

/* SECTION BLOCK */
.block { background: var(--bg2); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; box-shadow: var(--shadow); }
.block.cream { background: var(--bg3); }
.block-title { background: var(--hdr); color: var(--dg); font-size: 11px; font-weight: 700; padding: 6px 12px; letter-spacing: .5px; text-transform: uppercase; border-bottom: 1px solid var(--border); }
.block-body { padding: 10px 12px; }

/* KV ROW */
.kv { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 0; border-bottom: 1px solid rgba(74,124,89,.07); }
.kv:last-child { border-bottom: none; }
.kv-l { color: var(--txt); font-size: 13px; }
.kv-r { color: var(--gold); font-weight: 700; font-size: 13px; text-align: right; }
.kv-r.g { color: #27AE60; } .kv-r.t { color: var(--teal); } .kv-r.r { color: #C0392B; }

/* COLOR ROW */
.crow { display: flex; align-items: center; margin-bottom: 5px; border-radius: 4px; overflow: hidden; background: var(--green-bg); }
.crow.blue { background: var(--blue-bg); } .crow.orange { background: var(--orange-bg); } .crow.yellow { background: var(--yellow-bg); }
.cbar { width: 4px; min-height: 34px; align-self: stretch; background: var(--green-bar); flex-shrink: 0; }
.crow.blue .cbar { background: var(--blue-bar); } .crow.orange .cbar { background: var(--orange-bar); } .crow.yellow .cbar { background: var(--yellow-bar); }
.ccontent { padding: 5px 10px; flex: 1; }
.clabel { font-weight: 700; font-size: 12px; color: var(--txt); }
.cdesc { font-size: 11px; color: var(--txt2); }

/* WOCHENPLAN */
.kw-label { font-size: 13px; font-weight: 700; color: var(--dg); margin-bottom: 10px; padding: 6px 10px; background: var(--hdr); border-radius: 6px; }
.tag-card { margin-bottom: 8px; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.tag-hdr { background: var(--dg); color: #fff; font-weight: 700; font-size: 13px; padding: 7px 12px; display: flex; justify-content: space-between; }
.tag-hdr-cost { font-size: 11px; opacity: .8; font-weight: 400; }
.tag-body { background: var(--bg); border: 1px solid var(--border); border-top: none; border-radius: 0 0 var(--radius) var(--radius); }
.meal-row { padding: 9px 12px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .1s; }
.meal-row:last-child { border-bottom: none; }
.meal-row:hover { background: var(--bg2); }
.meal-time { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
.meal-time.m { color: #2E7D32; } /* grün statt gelb für Mittag */
.meal-time.a { color: var(--teal); }
.meal-name { font-size: 14px; font-weight: 600; color: var(--txt); }
.meal-meta { display: flex; gap: 10px; font-size: 11px; color: var(--txt2); margin-top: 3px; flex-wrap: wrap; }

/* SLOT BADGES */
.badge { display: inline-block; font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 6px; margin-right: 2px; }
.b-it { background: #E8F4E8; color: #1B5E20; }
.b-de { background: #E3F2FD; color: #0D47A1; }
.b-veg { background: #F3E5F5; color: #4A148C; }
.b-bur { background: #FFF3E0; color: #BF360C; }

/* MODAL */
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 200; align-items: flex-end; justify-content: center; }
.overlay.open { display: flex; }
.modal { background: var(--bg); width: 100%; max-width: 680px; max-height: 88vh; border-radius: 14px 14px 0 0; overflow-y: auto; padding-bottom: env(safe-area-inset-bottom,16px); }
.modal-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 10px auto 0; }
.modal-hdr { padding: 10px 16px; border-bottom: 2px solid var(--hdr); position: sticky; top: 0; background: var(--bg); z-index: 1; }
.modal-title { font-size: 16px; font-weight: 700; color: var(--dg); }
.modal-sub { font-size: 11px; color: var(--txt2); margin-top: 2px; }
.modal-close { position: absolute; top: 10px; right: 12px; background: var(--bg2); border: none; cursor: pointer; width: 26px; height: 26px; border-radius: 50%; font-size: 14px; color: var(--txt); display: flex; align-items: center; justify-content: center; }
.modal-body { padding: 12px 16px; }
.m-sec { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--dg); margin: 12px 0 5px; padding-bottom: 3px; border-bottom: 1px solid var(--border); }
.zutat-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid rgba(0,0,0,.04); font-size: 13px; }
.zutat-m { color: var(--gold); font-weight: 700; text-align: right; min-width: 80px; }
.step-row { display: flex; gap: 10px; margin-bottom: 8px; font-size: 13px; }
.step-n { background: var(--dg); color: #fff; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; margin-top: 1px; }
.hint-box { background: var(--blue-bg); border-left: 4px solid var(--blue-bar); padding: 7px 10px; border-radius: 0 4px 4px 0; font-size: 12px; margin-top: 8px; }

/* ANGEBOTE */
.markt-hdr { background: var(--teal); color: #fff; padding: 7px 12px; border-radius: var(--radius) var(--radius) 0 0; font-size: 13px; font-weight: 700; display: flex; justify-content: space-between; }
.markt-sub { font-size: 10px; opacity: .82; font-weight: 400; }
.app-pill { background: #fff; color: var(--teal); font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 8px; }
.kat-hdr { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: var(--dg); margin: 8px 0 3px; }

/* EINKAUF */
.ei-item { display: flex; align-items: flex-start; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); }
.ei-item:last-child { border-bottom: none; }
.ei-chk { width: 18px; height: 18px; border: 2px solid var(--dg); border-radius: 4px; flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; margin-top: 2px; transition: all .15s; }
.ei-chk.done { background: var(--dg); color: #fff; }
.ei-chk.done::after { content: "✓"; font-size: 11px; font-weight: 700; }
.ei-info { flex: 1; }
.ei-name { font-size: 13px; font-weight: 600; }
.ei-detail { font-size: 11px; color: var(--txt2); }
.ei-preis { text-align: right; min-width: 60px; }
.preis-m { font-size: 13px; font-weight: 700; color: var(--gold); }
.preis-a { font-size: 10px; color: var(--teal); font-weight: 700; }
.gesamt-row { background: var(--hdr); padding: 7px 12px; border-radius: 4px; display: flex; justify-content: space-between; margin-top: 4px; font-weight: 700; }
.gesamt-l { color: var(--dg); font-size: 13px; }
.gesamt-v { color: var(--gold); font-size: 15px; }

/* REZEPTE */
.rezept-tab-bar { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.rtab { background: var(--bg3); border: 1.5px solid var(--border); color: var(--txt); padding: 5px 12px; border-radius: 14px; font-size: 12px; cursor: pointer; transition: all .15s; }
.rtab.active { background: var(--dg); border-color: var(--dg); color: #fff; font-weight: 700; }
.rcard { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; overflow: hidden; cursor: pointer; box-shadow: var(--shadow); transition: box-shadow .15s; }
.rcard:hover { box-shadow: 0 3px 12px rgba(74,124,89,.18); }
.rcard-hdr { background: var(--bg2); padding: 9px 12px; display: flex; justify-content: space-between; align-items: flex-start; }
.rcard-name { font-size: 14px; font-weight: 700; color: var(--dg); }
.rcard-sub { font-size: 11px; color: var(--txt2); margin-top: 2px; }
.rcard-meta { display: flex; gap: 8px; padding: 6px 12px; font-size: 11px; color: var(--txt2); border-top: 1px solid var(--border); }

/* SMOOTHIE CARD */
.smcard { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; overflow: hidden; cursor: pointer; box-shadow: var(--shadow); }
.smcard-hdr { padding: 9px 12px; display: flex; justify-content: space-between; align-items: center; }
.smcard-name { font-size: 14px; font-weight: 700; color: var(--dg); }
.smcard-tag { font-size: 10px; color: var(--teal); font-weight: 600; }
.smcard-fokus { font-size: 11px; color: var(--txt2); padding: 0 12px 7px; }

/* SECTION DIVIDER */
.sec-divider { font-size: 12px; font-weight: 700; color: var(--dg); text-transform: uppercase; letter-spacing: .6px; margin: 14px 0 8px; padding-bottom: 4px; border-bottom: 2px solid var(--hdr); }

/* KOSTEN DETAIL */
.cost-panel { display:none; background:var(--blue-bg); border:1px solid var(--blue-bar); border-radius:6px; margin-top:6px; padding:8px 10px; font-size:12px; }
.cost-panel.open { display:block; }
.cost-row { display:flex; justify-content:space-between; align-items:baseline; padding:3px 0; border-bottom:1px solid rgba(33,150,243,.12); }
.cost-row:last-child { border-bottom:none; }
.cost-zutat { color:var(--txt); flex:1; }
.cost-markt { color:var(--teal); font-size:10px; font-weight:700; margin:0 8px; }
.cost-preis { color:var(--gold); font-weight:700; white-space:nowrap; }
.cost-total { background:var(--hdr); border-radius:4px; padding:4px 8px; display:flex; justify-content:space-between; margin-top:5px; font-weight:700; font-size:12px; }
.cost-btn { display:inline-flex; align-items:center; gap:3px; margin-top:4px; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:2px 8px; font-size:10px; font-weight:700; color:var(--teal); cursor:pointer; transition:all .15s; }
.cost-btn:hover { background:var(--blue-bg); border-color:var(--blue-bar); }

/* LOADING */
.loading { text-align: center; padding: 40px 20px; color: var(--txt2); }
.spinner { width: 30px; height: 30px; border: 3px solid var(--hdr); border-top-color: var(--dg); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty { text-align: center; padding: 30px; color: var(--txt2); }

@media (min-width: 480px) { .main { padding: 16px; } }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-row">
    <div>
      <div class="site-title">🍽 Küchenwoche</div>
      <div class="site-sub">Rike & Papa</div>
    </div>
    <div class="header-actions">
      <div class="budget-badge" id="budget-badge">💰 8,50 €/Tag</div>
      <button class="theme-btn" id="theme-btn" onclick="toggleTheme()" title="Hell/Dunkel">☀️</button>
    </div>
  </div>
  <nav class="nav-tabs">
    <button class="nav-tab active" onclick="showView('wochenplan',this)">📅 Wochenplan</button>
    <button class="nav-tab" onclick="showView('einkaufen',this)">🛒 Einkaufen</button>
    <button class="nav-tab" onclick="showView('angebote',this)">🏷 Angebote</button>
    <button class="nav-tab" onclick="showView('rezepte',this)">📖 Rezepte</button>
  </nav>
</header>

<main class="main">
  <div id="view-wochenplan" class="view active">
    <div class="loading"><div class="spinner"></div>Lädt…</div>
  </div>
  <div id="view-einkaufen" class="view">
    <div class="loading"><div class="spinner"></div>Lädt…</div>
  </div>
  <div id="view-angebote" class="view">
    <div class="loading"><div class="spinner"></div>Lädt…</div>
  </div>
  <div id="view-rezepte" class="view">
    <div class="loading"><div class="spinner"></div>Lädt…</div>
  </div>
</main>

<!-- MODAL -->
<div class="overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-hdr">
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-sub" id="modal-sub"></div>
      <button class="modal-close" onclick="closeModalDirect()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
let D = null;
const TAGE_ORDER = ['mo','di','mi','do','fr','sa','so'];
const TAGE_LABEL = {mo:'Montag',di:'Dienstag',mi:'Mittwoch',do:'Donnerstag',fr:'Freitag',sa:'Samstag',so:'Sonntag'};
const KAT_ICON = {geflügel:'🍗',fleisch:'🥩',fisch:'🐟','gemüse-tk':'🥦','gemüse-frisch':'🥕',milch:'🧀',tiefkühl:'❄️',stärke:'🍝',staerke:'🍝',konserve:'🥫',sonstige:'📦'};

// THEME
let dark = localStorage.getItem('kuechen-theme') === 'dark';
function applyTheme() {
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  document.getElementById('theme-btn').textContent = dark ? '🌙' : '☀️';
}
function toggleTheme() { dark = !dark; localStorage.setItem('kuechen-theme', dark ? 'dark' : 'light'); applyTheme(); }
applyTheme();

// DATA
async function loadData() {
  try {
    const r = await fetch('data.json?v=' + Date.now(), { cache: 'no-store' });
    D = await r.json();
    renderAll();
  } catch(e) {
    document.querySelectorAll('.loading').forEach(el => el.innerHTML = '⚠️ data.json nicht gefunden.');
  }
}

function renderAll() { renderWochenplan(); renderAngebote(); renderEinkauf(); renderRezepte('kochrezepte'); }

// VIEW
function showView(name, btn) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  btn.classList.add('active');
}

function fmt(v, s='') { return v != null ? Number(v).toFixed(2).replace('.',',') + s : '—'; }

function getSlots(tags) {
  const t = Array.isArray(tags) ? tags : (tags||'').split(',');
  const s = [];
  if (t.some(x => ['pasta','pizza','risotto','italienisch'].includes(x.trim()))) s.push('<span class="badge b-it">🇮🇹 IT</span>');
  if (t.some(x => ['deutsch','schnitzel','gulasch','frikadelle','eintopf','braten'].includes(x.trim()))) s.push('<span class="badge b-de">🇩🇪 DE</span>');
  if (t.some(x => x.trim()==='vegetarisch')) s.push('<span class="badge b-veg">🌿 VEG</span>');
  if (t.some(x => ['burger','hot-dog','hotdog'].includes(x.trim()))) s.push('<span class="badge b-bur">🍔 BUR</span>');
  return s.join('');
}

// ====== WOCHENPLAN ======
function renderWochenplan() {
  if (!D) return;
  const { wochenplan, rezepte_main, meta } = D;
  const rmap = {}; (rezepte_main||[]).forEach(r => rmap[r.id] = r);

  // Nur mahlzeit == mittag/abend, nach variante/woche gruppieren — nimm neueste Woche
  const wochen = {};
  wochenplan.forEach(wp => {
    if (!['mittag','abend'].includes(wp.mahlzeit)) return;
    const k = wp.variante + '_' + wp.woche;
    if (!wochen[k]) wochen[k] = { variante: wp.variante, woche: wp.woche, tage: {} };
    if (!wochen[k].tage[wp.tag]) wochen[k].tage[wp.tag] = [];
    wochen[k].tage[wp.tag].push(wp);
  });

  const kwLabel = meta?.kw_label || '';
  let html = kwLabel ? `<div class="kw-label">📅 ${kwLabel}</div>` : '';

  if (Object.keys(wochen).length === 0) {
    html += '<div class="empty">Noch kein Wochenplan. Bitte Skill ausführen.</div>';
  } else {
    // Nur letzte Variante (kw22)
    const latest = Object.values(wochen).sort((a,b) => b.woche - a.woche)[0];
    const tagsInWoche = TAGE_ORDER.filter(t => latest.tage[t]);
    tagsInWoche.forEach(tag => {
      const meals = latest.tage[tag].sort((a,b) => a.mahlzeit < b.mahlzeit ? -1 : 1);
      const cost = meals.reduce((s,m) => s + (parseFloat(m.kosten)||0), 0);
      html += `<div class="tag-card">
        <div class="tag-hdr"><span>${TAGE_LABEL[tag]||tag}</span><span class="tag-hdr-cost">${cost>0?'~'+cost.toFixed(2).replace('.',',')+'€':''}</span></div>
        <div class="tag-body">`;
      meals.forEach(wp => {
        const r = rmap[wp.rezept_id] || {};
        const isMit = wp.mahlzeit === 'mittag';
        const cpid = `cp-${tag}-${wp.mahlzeit}`;
        html += `<div class="meal-row" onclick="openRezept(${r.id})">
          <div class="meal-time ${isMit?'m':'a'}">${isMit ? 'Mittagessen · 14:30' : 'Abendessen · 18:00'}</div>
          <div class="meal-name">${r.name||wp.rezept_name||'—'} <span style="color:var(--txt2);font-size:11px;font-weight:400">#${r.id||''}</span></div>
          <div class="meal-meta">
            ${r.zeit?`<span>⏱ ${r.zeit} Min</span>`:''}
            ${r.kcal?`<span>🔥 ${r.kcal} kcal</span>`:''}
            ${r.kosten?`<span>💰 ${fmt(r.kosten,'€')}</span>`:''}
            ${getSlots(r.tags||[])}
          </div>
          <button class="cost-btn" onclick="event.stopPropagation();toggleCostPanel('${cpid}',${r.id})">💰 Woher &amp; was kostet es?</button>
          <div class="cost-panel" id="${cpid}"></div>
        </div>`;
      });
      html += `</div></div>`;
    });
  }

  const el = document.getElementById('view-wochenplan');
  el.innerHTML = html;
}

// ====== ANGEBOTE ======
function renderAngebote() {
  if (!D) return;
  const heute = new Date().toISOString().slice(0,10);
  const gueltig = (D.angebote||[]).filter(a => a.bis >= heute);

  if (!gueltig.length) {
    document.getElementById('view-angebote').innerHTML = '<div class="empty">Keine aktuellen Angebote. Neuen Prospekt einlesen lassen.</div>';
    return;
  }
  const maerkte = {};
  gueltig.forEach(a => { if(!maerkte[a.markt]) maerkte[a.markt]=[]; maerkte[a.markt].push(a); });

  let html = `<div class="block cream"><div class="block-title">📱 App-Hinweis</div><div class="block-body">
    <div class="crow blue"><div class="cbar"></div><div class="ccontent"><div class="clabel">📱 = App-Preis</div><div class="cdesc">EDEKA App · Penny App vor dem Einkauf aktivieren!</div></div></div>
  </div></div>`;

  const KAT_ORDER = ['geflügel','fleisch','fisch','gemüse-tk','gemüse-frisch','milch','tiefkühl','stärke','staerke','konserve','sonstige'];

  Object.keys(maerkte).sort().forEach(markt => {
    const items = maerkte[markt];
    const hatApp = items.some(a => a.preis_app);
    const byKat = {};
    items.forEach(a => { const k=a.kat||'sonstige'; if(!byKat[k]) byKat[k]=[]; byKat[k].push(a); });

    html += `<div style="margin-bottom:12px">
      <div class="markt-hdr">
        <span>${markt}</span>
        <span style="display:flex;gap:6px;align-items:center">
          <span class="markt-sub">bis ${items[0].bis.slice(5).replace('-','.')}</span>

      byKat[kat].forEach(a => {

        const isApp = !!(a.preis_app && parseFloat(a.preis_app) < parseFloat(a.preis));
        html += `<div class="kv">

          <div style="text-align:right">
            <div class="kv-r">${fmt(bp,'€')}${isApp?' 📱':''}</div>
            ${isApp?`<div style="font-size:10px;color:var(--txt2);text-decoration:line-through">${fmt(parseFloat(a.preis),'€')}</div>`:''}
            ${a.kg_preis?`<div style="font-size:10px;color:var(--txt2)">${fmt(parseFloat(a.kg_preis),'€')}/kg</div>`:''}

  });

  document.getElementById('view-angebote').innerHTML = html;
}

// ====== EINKAUF ======

const VORRAT_KEYS = ['olivenöl','olivenoel','salz','pfeffer','knoblauch','zwiebel','tomatenmark',
  'curry','kurkuma','oregano','mehl','brühe','wasser','zucker','öl','butterschmalz',
  'gewürz','kräuter','basilikum','petersilie','chiliflocken','muskat','sojasoße','essig'];

function isVorrat(name) {
  if(!name) return true;
  const n = name.toLowerCase();
  return VORRAT_KEYS.some(k => n.includes(k));
}

function parseGr(s) {
  if(!s) return null;
  const str = String(s).replace(',','.');
  const m = str.match(/([\d.]+)\s*(kg|g|ml|l)/i);
  if(!m) return null;
  const v = parseFloat(m[1]), u = m[2].toLowerCase();
  return (u==='kg'||u==='l') ? v*1000 : v;
}

function calcPackungen(benötigt, handelsgr) {
  if(!benötigt || !handelsgr) return null;
  const packs = Math.ceil(benötigt / handelsgr);
  const rest = (packs * handelsgr) - benötigt;
  return { packs, rest };
}

function bestAng(name, angebote) {
  if(!name) return null;
  const n = name.toLowerCase().replace(/[()\/\-]/g,' ');
  const words = n.split(/\s+/).filter(w => w.length > 3 &&
    !['oder','und','mit','aus','von','für','beim','nach','statt','kein','keine','aufgetaut'].includes(w));

  // Konfliktvermeidung: Hack ≠ Steak/Schenkel, Hähnchenbrust ≠ Schenkel/Keule
  const KONFLIKTE = {
    'hack': ['steak','schenkel','keule','kotelett','roastbeef','entrecote','rumpsteak'],
    'hackfleisch': ['steak','schenkel','keule','kotelett'],
    'hähnchenbrustfilet': ['schenkel','keule','kotelett','mariniert','hammerkeu'],
    'hähnchenbrust': ['schenkel','keule','kotelett','hammerkeu'],
    'putenbrust': ['schenkel','keule'],
    'seelachs': ['lachs','räucherlachs','lachskotelett'],
  };

  let hits = [];
  for(const kw of words) {
    const treffer = angebote.filter(a => {
      const ap = a.produkt.toLowerCase();
      if(!ap.includes(kw)) return false;
      // Konflikte prüfen
      for(const [zutatKey, verboten] of Object.entries(KONFLIKTE)) {
        if(n.includes(zutatKey) && verboten.some(v => ap.includes(v))) return false;
      }
      return true;
    });
    hits.push(...treffer);
  }
  const seen = new Set();
  hits = hits.filter(a => { if(seen.has(a.produkt)) return false; seen.add(a.produkt); return true; });
  // Sortiere: niedrigster kg-Preis, aber Frischprodukte mit 100g-Einheit erst nach Packware
  hits.sort((a,b) => {
    const ka = parseFloat(a.kg_preis)||999, kb = parseFloat(b.kg_preis)||999;
    // 100g Einheit (Theke) = teurer in der Praxis, leicht benachteiligen
    const penA = a.einheit && a.einheit.toLowerCase()==='100g' ? 2 : 0;
    const penB = b.einheit && b.einheit.toLowerCase()==='100g' ? 2 : 0;
    return (ka+penA) - (kb+penB);
  });
  return hits[0] || null;
}

function renderEinkauf() {
  if(!D) return;
  const heute = new Date().toISOString().slice(0,10);
  const gueltig = (D.angebote||[]).filter(a => a.bis >= heute && a.relevant==='ok');
  const rmap = {}; (D.rezepte_main||[]).forEach(r => rmap[r.id]=r);

  // Nur aktuelle Woche: höchste Woche aus neuestem Variante
  const allWp = D.wochenplan||[];
  const latestVariante = allWp.length
    ? allWp.reduce((best, wp) => wp.woche > best.woche ? wp : best, allWp[0])
    : null;
  const currentWp = latestVariante
    ? allWp.filter(wp => wp.variante === latestVariante.variante && wp.woche === latestVariante.woche)
    : allWp;

  // SCHRITT 1: Alle Zutaten aggregieren (Gramm summieren)
  const aggr = {};
  currentWp.forEach(wp => {
    const r = rmap[wp.rezept_id];
    if(!r || !r.zutaten) return;
    r.zutaten.forEach(z => {
      if(!Array.isArray(z) || !z[1]) return;
      const name = z[1], menge = z[0]||'';
      if(isVorrat(name)) return;
      const key = name.toLowerCase().replace(/[()\/\-]/g,' ').split(/\s+/)
        .filter(w=>w.length>2).slice(0,2).join(' ');
      if(!key || key.length<3) return;
      if(!aggr[key]) aggr[key] = { name, grammTotal:0, rezepte:[], rezeptIds:[], isTK: false };
      const gr = parseGr(menge);
      if(gr) aggr[key].grammTotal += gr;
      aggr[key].rezepte.push(r.name);
      if(r.id && !aggr[key].rezeptIds.includes(r.id)) aggr[key].rezeptIds.push(r.id);
      if(name.toLowerCase().includes('tk')||name.toLowerCase().includes('tiefkühl')) aggr[key].isTK = true;
    });
  });

  // SCHRITT 2: Bestes Angebot pro Zutat (1x, kein Duplikat)
  const byMarkt = {}, ohneAng = [];
  const usedAngebote = new Set();

  Object.values(aggr).forEach(z => {
    const ang = bestAng(z.name, gueltig);
    if(ang) {
      // Verhindere dass gleiches Angebot für zwei verschiedene Zutaten erscheint
      if(usedAngebote.has(ang.produkt)) {
        // Zusammenführen mit bestehender Position
        const m = ang.markt;
        const existing = (byMarkt[m]||[]).find(x=>x.ang.produkt===ang.produkt);
        if(existing) { existing.grammTotal+=z.grammTotal; existing.rezepte.push(...z.rezepte); (z.rezeptIds||[]).forEach(id=>{if(!existing.rezeptIds)existing.rezeptIds=[];if(!existing.rezeptIds.includes(id))existing.rezeptIds.push(id);}); return; }
      }
      usedAngebote.add(ang.produkt);
      if(!byMarkt[ang.markt]) byMarkt[ang.markt]=[];
      byMarkt[ang.markt].push({...z, ang});
    } else {
      ohneAng.push(z);
    }
  });

  // SCHRITT 3: HTML
  let totalApp=0, totalNorm=0, appSave=0;
  const resteliste=[];

  let html = `<div class="block cream"><div class="block-title">ℹ️ Legende</div><div class="block-body">
    <div class="crow blue"><div class="cbar"></div><div class="ccontent"><div class="clabel">📱 App-Preis</div><div class="cdesc">EDEKA App · Penny App vor dem Einkauf aktivieren</div></div></div>
    <div class="crow" style="margin-top:4px"><div class="cbar" style="background:#26A69A"></div><div class="ccontent"><div class="clabel">🧊 Rest einfrieren</div><div class="cdesc">Übrige Mengen TK-tauglich</div></div></div>
    <div class="crow" style="margin-top:4px"><div class="cbar" style="background:#9E9E9E"></div><div class="ccontent"><div class="clabel">Grundvorrat</div><div class="cdesc">Öl · Salz · Gewürze — nicht aufgelistet</div></div></div>
  </div></div>`;

  Object.keys(byMarkt).sort().forEach((markt,mi) => {
    const items = byMarkt[markt];
    html += `<div class="block"><div class="block-title" style="background:var(--teal);color:#fff">${markt}</div><div class="block-body" style="padding:8px 12px">`;
    let marktTotal = 0;

    items.forEach((it,i) => {
      const a = it.ang;
      const bp = parseFloat(a.preis_app||a.preis)||0;
      const np = parseFloat(a.preis)||bp;
      const isApp = !!(a.preis_app && parseFloat(a.preis_app)<np);
      const handelsgr = parseGr(a.einheit);
      const pack = it.grammTotal>0 && handelsgr ? calcPackungen(it.grammTotal, handelsgr) : null;
      const anzahl = pack ? pack.packs : 1;
      const kosten = bp * anzahl;
      totalApp += kosten; totalNorm += np * anzahl;
      if(isApp) appSave += (np-bp)*anzahl;
      marktTotal += kosten;

      // Rest merken
      if(pack && pack.rest > 50) {
        const isTKfaehig = it.isTK || ['hack','hähnchen','haehnchen','pute','fisch','lachs','fleisch'].some(k=>it.name.toLowerCase().includes(k));
        resteliste.push({name:it.name, rest:pack.rest, tk:isTKfaehig});
      }

      const rezStr = [...new Set(it.rezepte)].slice(0,3).join(' · ');
      const rezNrStr = (it.rezeptIds||[]).length
        ? 'Rezept ' + it.rezeptIds.map(id=>'#'+id).join(' · ')
        : rezStr;
      const id = `chk-${mi}-${i}`;

      html += `<div class="ei-item">
        <div class="ei-chk" id="${id}" onclick="this.classList.toggle('done')"></div>
        <div class="ei-info">
          <div class="ei-name">${a.produkt}</div>
          <div class="ei-detail">
            ${pack ? `<strong>${pack.packs}× ${a.einheit||''}</strong> · benötigt ~${it.grammTotal}g` : (a.einheit||'')}
            ${pack && pack.rest>50
              ? ` · <span style="color:#26A69A;font-weight:700">Rest ~${Math.round(pack.rest)}g 🧊</span>`
              : pack && pack.rest<=50 ? ` · <span style="color:var(--green-bar);font-weight:600">✓ aufgebraucht</span>` : ''}
          </div>
          <div style="font-size:10px;color:var(--txt2);margin-top:1px">${rezNrStr}</div>
        </div>
        <div class="ei-preis">
          <div class="preis-m">${anzahl>1?anzahl+'× ':''}${fmt(bp,'€')}${isApp?' 📱':''}</div>
          ${anzahl>1?`<div style="font-size:11px;color:var(--gold);font-weight:700">= ${fmt(kosten,'€')}</div>`:''}
          ${isApp?`<div style="font-size:10px;color:var(--txt2);text-decoration:line-through">${fmt(np,'€')}</div>`:''}
        </div>
      </div>`;
    });

    html += `<div class="gesamt-row"><span class="gesamt-l">Gesamt ${markt}</span><span class="gesamt-v">${fmt(marktTotal,'€')}</span></div>`;
    html += `</div></div>`;
  });

  if(ohneAng.length) {
    html += `<div class="block cream"><div class="block-title">🛒 Sonstiges</div><div class="block-body" style="padding:8px 12px">`;
    ohneAng.forEach((it,i) => {
      html += `<div class="ei-item">
        <div class="ei-chk" id="chk-r-${i}" onclick="this.classList.toggle('done')"></div>
        <div class="ei-info">
          <div class="ei-name">${it.name}</div>
          <div style="font-size:10px;color:var(--txt2)">${it.grammTotal>0?'~'+it.grammTotal+'g · ':''}${(it.rezeptIds||[]).length ? it.rezeptIds.map(id=>'#'+id).join(' · ') : [...new Set(it.rezepte)].slice(0,2).join(' · ')}</div>
        </div>
        <div class="ei-preis"><div class="preis-m" style="color:var(--txt2)">—</div></div>
      </div>`;
    });
    html += `</div></div>`;
  }

  // Reste-Übersicht
  if(resteliste.length) {
    html += `<div class="block"><div class="block-title">♻️ Reste diese Woche</div><div class="block-body">`;
    resteliste.forEach(r => {
      html += `<div class="crow ${r.tk?'':'orange'}">
        <div class="cbar" style="background:${r.tk?'#26A69A':'var(--orange-bar)'}"></div>
        <div class="ccontent">
          <div class="clabel">${r.name}</div>
          <div class="cdesc">~${Math.round(r.rest)}g übrig → ${r.tk?'🧊 einfrieren für nächste Woche':'📅 diese Woche noch verwenden'}</div>
        </div></div>`;
    });
    html += `</div></div>`;
  }

  // App-Ersparnis
  if(appSave > 0.01) {
    html += `<div class="block"><div class="block-title">💰 App-Ersparnis</div><div class="block-body">
      <div class="kv"><div class="kv-l">Ohne App</div><div class="kv-r r">${fmt(totalNorm,'€')}</div></div>
      <div class="kv"><div class="kv-l">Mit App 📱</div><div class="kv-r g">${fmt(totalApp,'€')}</div></div>
      <div class="kv"><div class="kv-l">Ersparnis</div><div class="kv-r t">${fmt(appSave,'€')}</div></div>
    </div></div>`;
  }

  // Budget-Check
  const budget = (D.meta?.budget_tag||8.50) * 5;
  const diff = totalApp - budget;
  html += `<div class="block"><div class="block-title">📊 Budget-Check Woche</div><div class="block-body">
    <div class="kv"><div class="kv-l">Einkauf gesamt</div><div class="kv-r">${fmt(totalApp,'€')}</div></div>
    <div class="kv"><div class="kv-l">Budget (5×8,50€)</div><div class="kv-r">${fmt(budget,'€')}</div></div>
    <div class="kv"><div class="kv-l">${diff>0?'⚠️ Über Budget':'✓ Im Budget'}</div>
      <div class="kv-r ${diff>0?'r':'g'}">${diff>0?'+':''}${fmt(Math.abs(diff),'€')}</div></div>
  </div></div>`;

  document.getElementById('view-einkaufen').innerHTML = html;
}

  if(!D) return;

  rezSearch = '';
  document.getElementById('view-rezepte').innerHTML = buildRezepteHTML();
}

function doSearch() {
  const val = document.getElementById('rez-search').value.trim().toLowerCase();
  rezSearch = val;
  document.getElementById('view-rezepte').innerHTML = buildRezepteHTML();
  setTimeout(()=>{ const el=document.getElementById('rez-search'); if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);} },30);
}

function clearSearch() {
  rezSearch = '';
  document.getElementById('view-rezepte').innerHTML = buildRezepteHTML();
}

function buildRezepteHTML() {
  if(!D) return '';
  const tabs = [
    {key:'kochrezepte',    label:'🍽 Kochrezepte'},
    {key:'sandwiches',     label:'🥪 Sandwiches'},
    {key:'smoothies-rike', label:'🥤 Smoothies Rike'},
    {key:'smoothies-papa', label:'🥤 Smoothies Papa'},

  let html = `<div class="rezept-tab-bar">${tabs.map(t=>`<button class="rtab ${(!rezSearch && rezTab===t.key)?'active':''}" onclick="renderRezepte('${t.key}')">${t.label}</button>`).join('')}</div>`;

  html += `<div style="display:flex;gap:6px;margin-bottom:10px">
    <input id="rez-search" type="text" placeholder="🔍 Alle Bereiche durchsuchen…"
      value="${rezSearch}"
      onkeydown="if(event.key==='Enter'){event.preventDefault();doSearch();}"
      style="flex:1;padding:8px 12px;border:1.5px solid var(--border);border-radius:20px;
             font-size:13px;background:var(--bg);color:var(--txt);outline:none;">
    ${rezSearch
      ? `<button onclick="clearSearch()" style="padding:7px 12px;border-radius:20px;border:1.5px solid var(--border);background:var(--bg2);color:var(--txt);cursor:pointer;font-size:13px">✕ Löschen</button>`
      : `<button onclick="doSearch()" style="padding:7px 14px;border-radius:20px;border:none;background:var(--dg);color:#fff;cursor:pointer;font-size:13px;font-weight:700">Suchen</button>`
    }
  </div>`;

  if(rezSearch) {
    // Alle vier Bereiche durchsuchen
    function mR(r) { return [r.name,r.sub||'',r.kategorie||'',(r.tags||[]).join(' '),(r.zutaten||[]).map(z=>Array.isArray(z)?z[1]:z).join(' '),r.hinweis||'',r.tipp||''].join(' ').toLowerCase().includes(rezSearch); }
    function mS(s) { return [s.name,s.typ||s.sub||'',(s.zutaten||[]).map(z=>Array.isArray(z)?z[1]:z).join(' '),s.nutzen||'',s.tipp||''].join(' ').toLowerCase().includes(rezSearch); }
    const rK=(D.rezepte_main||[]).filter(mR), rS=(D.rezepte_sandwiches||[]).filter(mS),
          rR=(D.rezepte_smoothies_rike||[]).filter(mS), rP=(D.rezepte_smoothies_papa||[]).filter(mS);
    const total=rK.length+rS.length+rR.length+rP.length;
    html += `<div style="font-size:12px;color:var(--txt2);margin-bottom:8px">${total} Ergebnis${total!==1?'se':''} für <strong>"${rezSearch}"</strong> in allen Bereichen</div>`;
    if(!total) {
      html += `<div class="empty"><div style="font-size:32px;margin-bottom:8px">🔍</div>Nichts gefunden.<br><small>Versuch z.B. "Hähnchen", "Kartoffel", "Pasta", "Banane"</small></div>`;
    } else {
      if(rK.length)  { html+=`<div class="sec-divider">🍽 Kochrezepte (${rK.length})</div>`;      rK.forEach(r=>html+=alleRezeptCard(r)); }
      if(rS.length)  { html+=`<div class="sec-divider">🥪 Sandwiches (${rS.length})</div>`;       rS.forEach(r=>html+=sandwichCard(r)); }
      if(rR.length)  { html+=`<div class="sec-divider">🥤 Smoothies Rike (${rR.length})</div>`;   rR.forEach(s=>html+=smoothieCard(s,'rike')); }
      if(rP.length)  { html+=`<div class="sec-divider">🥤 Smoothies Papa (${rP.length})</div>`;   rP.forEach(s=>html+=smoothieCard(s,'papa')); }
    }
    return html;
  }

  // Kochrezepte
  if(rezTab==='kochrezepte') {

    (D.rezepte_main||[]).forEach(r=>{ const k=`${r.kategorie}/${r.sub||'sonstige'}`; if(!gr[k]) gr[k]=[]; gr[k].push(r); });
    [...Object.keys(gr)].sort((a,b)=>(ORD.indexOf(a)<0?99:ORD.indexOf(a))-(ORD.indexOf(b)<0?99:ORD.indexOf(b)))

    (D.rezepte_sandwiches||[]).filter(r=>r.sub==='suess').length && (html+=`<div class="sec-divider">🍫 Süß</div>`,(D.rezepte_sandwiches||[]).filter(r=>r.sub==='suess').forEach(r=>html+=sandwichCard(r)));
  }
  if(rezTab==='smoothies-rike') { html+=`<div class="sec-divider">🌸 Schul-Smoothies Mo–Fr</div>`; (D.rezepte_smoothies_rike||[]).forEach(s=>html+=smoothieCard(s,'rike')); }
  if(rezTab==='smoothies-papa') { html+=`<div class="sec-divider">💪 Sport & Fokus Mo–Fr</div>`; (D.rezepte_smoothies_papa||[]).forEach(s=>html+=smoothieCard(s,'papa')); }
  return html;
}

  const slots=getSlots(r.tags||[]), hasK=(r.tags||[]).includes('käse-trennbar');

function sandwichCard(r) {
  return `<div class="rcard" onclick="openRezeptRaw(${JSON.stringify(r).replace(/"/g,'&quot;')})">
    <div class="rcard-hdr">
      <div><div class="rcard-name">${r.name}</div><div class="rcard-sub">${r.sub==='herzhaft'?'Herzhaft':'Süß'}</div></div>
      <div style="text-align:right;font-size:11px;color:var(--txt2)">${r.kcal?r.kcal+' kcal':''}</div>
    </div>
    <div class="rcard-meta">
      ${r.zeit?`<span>⏱ ${r.zeit} Min</span>`:''}
      ${r.protein?`<span>💪 ${r.protein}g</span>`:''}
      <span style="color:var(--teal);font-size:10px">Für Rike's Schulbrot</span>
    </div>
  </div>`;
}

function smoothieCard(s, who) {
  const col = who==='rike' ? 'var(--orange-bg)' : 'var(--blue-bg)';
  return `<div class="smcard" onclick="openSmoothie(${JSON.stringify(s).replace(/"/g,'&quot;')})" style="border-top:3px solid ${who==='rike'?'var(--orange-bar)':'var(--blue-bar)'}">
    <div class="smcard-hdr" style="background:${col}">
      <div><div class="smcard-name">${s.name}</div><div class="smcard-tag">${s.wochentag} · ${s.fokus}</div></div>
      <div style="text-align:right;font-size:11px;color:var(--txt2)">${s.kcal?s.kcal+' kcal':''}<br>${s.zeit?' ⏱ '+s.zeit+' Min':''}</div>
    </div>
  </div>`;
}

// ====== KOSTEN PANEL ======
const GRUNDVORRAT = ['olivenoel','olivenöl','salz','pfeffer','knoblauch','zwiebel','tomatenmark','curry','paprika gemah','kurkuma','oregano','pasta','reis','kokosmilch','honig','senf','worcester','mehl','brühe','wasser','zucker','öl','butter','gewürz','kräuter'];

function isGrundvorrat(name) {
  if(!name) return true;
  const n = name.toLowerCase();
  return GRUNDVORRAT.some(g => n.includes(g));
}

function toggleCostPanel(cpid, rezeptId) {
  const panel = document.getElementById(cpid);
  if(!panel) return;
  if(panel.classList.contains('open')) { panel.classList.remove('open'); return; }

  const r = (D.rezepte_main||[]).find(x => x.id === rezeptId);
  if(!r || !r.zutaten) { panel.innerHTML='<div style="color:var(--txt2)">Keine Zutaten gefunden.</div>'; panel.classList.add('open'); return; }

  const heute = new Date().toISOString().slice(0,10);
  const angebote = (D.angebote||[]).filter(a => a.bis >= heute && a.relevant === 'ok');

  function findAngebot(zutatName) {
    if(!zutatName) return null;
    const n = zutatName.toLowerCase();
    // Schlüsselwort-Matching: erstes sinnvolles Wort
    const keywords = n.replace(/[()\/]/g,' ').split(/\s+/).filter(w => w.length > 3 && !['oder','und','mit','aus','von','für','beim','nach'].includes(w));
    for(const kw of keywords) {
      const match = angebote.find(a => a.produkt.toLowerCase().includes(kw));
      if(match) return match;
    }
    return null;
  }

  function parseGramm(mengeStr) {
    if(!mengeStr) return null;
    const m = mengeStr.replace(',','.').match(/([\d.]+)\s*(g|kg|ml|l)/i);
    if(!m) return null;
    const val = parseFloat(m[1]);
    const unit = m[2].toLowerCase();
    if(unit==='kg'||unit==='l') return val*1000;
    return val;
  }

  function calcAnteil(angebot, mengeStr) {
    // Preis pro g aus Angebot, dann * menge
    const kgPreis = angebot.kg_preis ? parseFloat(angebot.kg_preis) : null;
    const gramm = parseGramm(mengeStr);
    if(kgPreis && gramm) return (kgPreis / 1000) * gramm;
    // Fallback: bester Preis / einheit-gramm * gramm
    const bp = parseFloat(angebot.preis_app || angebot.preis) || 0;
    const eg = parseGramm(angebot.einheit);
    if(bp && eg && gramm) return (bp / eg) * gramm;
    // Kann nicht berechnen → ganzen Preis nehmen
    return bp;
  }

  let rows = [];
  let totalBerechenbar = 0;
  let countAngebotsZutaten = 0;

  r.zutaten.forEach(z => {
    const menge = Array.isArray(z) ? z[0] : '';
    const name  = Array.isArray(z) ? z[1] : z;
    if(!name || isGrundvorrat(name)) return;

    const ang = findAngebot(name);
    if(ang) {
      const anteil = calcAnteil(ang, menge);
      const bp = parseFloat(ang.preis_app || ang.preis) || 0;
      const isApp = !!(ang.preis_app && parseFloat(ang.preis_app) < parseFloat(ang.preis));
      totalBerechenbar += anteil || 0;
      countAngebotsZutaten++;
      rows.push({
        name: name.split('(')[0].trim(),
        menge,
        markt: ang.markt,
        produkt: ang.produkt,
        bp,
        anteil,
        isApp
      });
    } else {
      rows.push({ name: name.split('(')[0].trim(), menge, markt: null, bp: null, anteil: null, isApp: false });
    }
  });

  let html = '';
  if(!rows.length) {
    html = '<div style="color:var(--txt2);font-size:12px">Alle Zutaten sind Grundvorrat.</div>';
  } else {
    rows.forEach(row => {
      html += `<div class="cost-row">
        <span class="cost-zutat">${row.menge ? `<span style="color:var(--txt2)">${row.menge}</span> ` : ''}${row.name}</span>
        ${row.markt
          ? `<span class="cost-markt">${row.markt}${row.isApp?' 📱':''}</span>
             <span class="cost-preis">${row.anteil ? '~'+row.anteil.toFixed(2).replace('.',',')+' €' : row.bp ? row.bp.toFixed(2).replace('.',',')+' €' : '—'}</span>`
          : `<span style="color:var(--txt2);font-size:10px">kein Angebot</span><span class="cost-preis" style="color:var(--txt2)">—</span>`
        }
      </div>`;
    });
    if(totalBerechenbar > 0) {
      html += `<div class="cost-total">
        <span style="color:var(--dg)">∑ Zutaten aus Angeboten</span>
        <span style="color:var(--gold)">~${totalBerechenbar.toFixed(2).replace('.',',')} €</span>
      </div>`;
    }
    html += `<div style="font-size:10px;color:var(--txt2);margin-top:4px">Grundvorrat (Öl, Salz, Gewürze…) nicht eingerechnet</div>`;
  }

  panel.innerHTML = html;
  panel.classList.add('open');
}

// ====== MODAL ======
function openRezept(id) {
  if(!D) return;
  const r = (D.rezepte_main||[]).find(x=>x.id===id);
  if(!r) return;
  openRezeptRaw(r);
}

function openRezeptRaw(r) {
  document.getElementById('modal-title').textContent = r.name;
  document.getElementById('modal-sub').innerHTML =
    `${r.kategorie||''} · ${r.sub||''} · ${r.zeit?r.zeit+' Min':''} · ${r.kcal?r.kcal+' kcal':''} · ${r.kosten?fmt(parseFloat(r.kosten),'€')+' (2 Pers.)':''}`;

  let body = '';
  const tags = Array.isArray(r.tags) ? r.tags : (r.tags||'').split(',');
  if(tags.includes('käse-trennbar')||(r.name||'').toLowerCase().includes('käse')) {
    body += `<div class="crow orange"><div class="cbar"></div><div class="ccontent"><div class="clabel">🧀 Käse separat</div><div class="cdesc">Rike mit Käse · Papa ohne — immer getrennt servieren</div></div></div>`;
  }
  if(r.zutaten?.length) {
    body += `<div class="m-sec">Zutaten (2 Personen)</div>`;
    r.zutaten.forEach(z => {
      if(!Array.isArray(z)) return;
      const isK = (z[1]||'').toLowerCase().includes('käse');
      body += `<div class="zutat-row"><div>${z[1]||''}${isK?' <span style="color:var(--teal);font-size:10px">★ Rike</span>':''}</div><div class="zutat-m">${z[0]||''}</div></div>`;
    });
  }
  if(r.schritte?.length) {
    body += `<div class="m-sec">Zubereitung</div>`;
    r.schritte.forEach((s,i) => {
      const txt = Array.isArray(s)?s.join(' '):s;
      body += `<div class="step-row"><div class="step-n">${i+1}</div><div>${txt}</div></div>`;
    });
  }
  if(r.hinweis) body += `<div class="hint-box">💡 ${r.hinweis}</div>`;
  if(r.tipp) body += `<div class="hint-box" style="background:var(--green-bg);border-color:var(--green-bar);margin-top:6px">🍴 ${r.tipp}</div>`;

  document.getElementById('modal-body').innerHTML = body;
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function openSmoothie(s) {
  document.getElementById('modal-title').textContent = s.name;
  document.getElementById('modal-sub').innerHTML = `${s.wochentag} · ${s.fokus} · ${s.kcal?s.kcal+' kcal':''} · ${s.zeit?s.zeit+' Min':''}`;
  let body = '';
  if(s.nutzen) body += `<div class="crow blue"><div class="cbar"></div><div class="ccontent"><div class="clabel">Wirkung</div><div class="cdesc">${s.nutzen}</div></div></div>`;
  if(s.zutaten?.length) {
    body += `<div class="m-sec">Zutaten</div>`;
    s.zutaten.forEach(z => { if(Array.isArray(z)) body += `<div class="zutat-row"><div>${z[1]}</div><div class="zutat-m">${z[0]}</div></div>`; });
  }
  if(s.schritte?.length) {
    body += `<div class="m-sec">Zubereitung</div>`;
    s.schritte.forEach((st,i) => body += `<div class="step-row"><div class="step-n">${i+1}</div><div>${st}</div></div>`);
  }
  if(s.tipp) body += `<div class="hint-box">💡 ${s.tipp}</div>`;
  document.getElementById('modal-body').innerHTML = body;
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(e) { if(e.target===document.getElementById('modal-overlay')) closeModalDirect(); }
function closeModalDirect() { document.getElementById('modal-overlay').classList.remove('open'); document.body.style.overflow=''; }

// URL PARAM
function initURL() {
  const p = new URLSearchParams(window.location.search).get('view');
  if(p) {
    const tabs = ['wochenplan','einkaufen','angebote','rezepte'];
    if(tabs.includes(p)) {
      document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
      document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
      document.getElementById('view-'+p).classList.add('active');
      document.querySelectorAll('.nav-tab')[tabs.indexOf(p)].classList.add('active');
    }
  }
}

initURL();
loadData();

<script>
if('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      // Sofort nach Update suchen bei jedem Start
      reg.update();
      reg.addEventListener('updatefound', () => {
        const w = reg.installing;
        w.addEventListener('statechange', () => {
          if(w.state==='activated') window.location.reload();
        });
      });
    });
  });
}
// Zusätzlich: bei jedem Fokus-Wechsel (App kommt in Vordergrund) SW updaten
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && navigator.serviceWorker.controller) {
    navigator.serviceWorker.ready.then(reg => reg.update());
  }
});
</script>
